name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ruff-action picks up the ruff version pinned in pyproject.toml / uv.lock
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check --diff
