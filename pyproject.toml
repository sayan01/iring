[project]
name = "iring"
version = "0.1.0"
description = "Download, Trim, and Install Iphone Ringtones from Youtube"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Sayan Ghosh", email = "sgic2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pymobiledevice3>=11.49.1",
    "typer>=0.27.3",
]

[project.scripts]
iring = "iring:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
